services:
  - type: web
    name: reposearch-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      name: reposearch-data
      mountPath: /data
      sizeGB: 1

  - type: web
    name: reposearch-frontend
    runtime: python
    buildCommand: pip install streamlit requests
    startCommand: streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0